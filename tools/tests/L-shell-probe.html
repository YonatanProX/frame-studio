<!doctype html><meta charset="utf-8"><title>probe</title>
<body style="margin:0;background:#000">
<iframe id="f" src="/app/index.html?project=fx-demo" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<pre id="result">pending</pre>
<script>
setTimeout(() => {
  const d = document.getElementById('f').contentDocument;
  const out = [];
  out.push('timeline: ' + !!d.querySelector('.fs-tl') + ' clips=' + d.querySelectorAll('.tl-clip').length);
  out.push('library: ' + !!d.querySelector('.fs-lib') + ' tabs=' + d.querySelectorAll('.lb-tab').length);
  out.push('fails: ' + [...d.querySelectorAll('.mod-fail')].map((x) => x.textContent.slice(0, 160)).join(' | '));
  document.getElementById('result').textContent = out.join('\n');
  document.title = 'DONE';
}, 7000);
</script>
